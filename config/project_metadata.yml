title: "Replication Archive: The AI Divide and the Resilience Paradox"
description: >
  Empirical research dataset and reproducible pipeline examining how structural
  geopolitical barriers (e.g., banking restrictions) catalyze compensatory
  psychological resilience and academic performance among higher education scholars.

