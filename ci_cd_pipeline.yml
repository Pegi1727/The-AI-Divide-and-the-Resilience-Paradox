name: Reproducibility and Validation CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  validate_pipeline:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy statsmodels matplotlib seaborn openpyxl pyyaml pingouin

      - name: Verify dataset integrity and preprocessing
        run: |
          python 01_data_preprocessing.py

      - name: Run statistical sanity tests
        run: |
          python 02_descriptive_and_normality.py
          python 03_correlation_and_collinearity.py
          python 04_regression_modeling.py
          python 05_mediation_and_path_analysis.py

      - name: Generate publication figures
        run: |
          python 06_publication_plots.py

      - name: Archive output figures and tables
        uses: actions/upload-artifact@v4
        with:
          name: empirical-artifacts-py${{ matrix.python-version }}
          path: |
            *.png
            *.csv
